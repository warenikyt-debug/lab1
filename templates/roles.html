<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление ролями</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border: 2px solid #000000;
            padding: 30px;
            width: 100%;
            max-width: 1200px;
        }
        h1 {
            text-align: center;
            color: #000000;
            margin-bottom: 30px;
            border-bottom: 2px solid #000000;
            padding-bottom: 15px;
        }
        h2 {
            color: #000000;
            border-bottom: 1px solid #000000;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .nav-links {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #000000;
            padding-bottom: 15px;
        }
        .nav-links a {
            color: #000000;
            text-decoration: none;
            margin: 0 10px;
            border: 1px solid #000000;
            padding: 5px 10px;
            display: inline-block;
        }
        .nav-links a:hover {
            background-color: #000000;
            color: #ffffff;
        }
        .status-bar {
            background-color: #f5f5f5;
            border: 1px solid #000000;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .token-status {
            font-family: monospace;
            font-weight: bold;
        }
        .token-status.active {
            color: #000000;
        }
        .token-status.inactive {
            color: #ff0000;
        }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .form-section {
            border: 1px solid #000000;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #000000;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #000000;
            background-color: #ffffff;
            color: #000000;
            font-size: 14px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        input:focus, textarea:focus {
            outline: none;
            border: 2px solid #000000;
        }
        button {
            padding: 8px 15px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #333333;
        }
        button.danger {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
        }
        button.danger:hover {
            background-color: #000000;
            color: #ffffff;
        }
        .list-section {
            border: 1px solid #000000;
            padding: 20px;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #000000;
        }
        th {
            background-color: #f5f5f5;
            font-weight: bold;
        }
        .actions {
            white-space: nowrap;
        }
        .actions button {
            padding: 3px 8px;
            font-size: 12px;
            margin-right: 5px;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border: 1px solid #000000;
            font-size: 11px;
        }
        .badge.active {
            background-color: #ffffff;
        }
        .badge.deleted {
            background-color: #f5f5f5;
        }
        .message {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #000000;
            display: none;
            text-align: center;
        }
        .message.success {
            background-color: #f5f5f5;
        }
        .message.error {
            background-color: #ffebee;
            border-color: #ff0000;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .empty {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        small {
            color: #666;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>УПРАВЛЕНИЕ РОЛЯМИ</h1>
        
        <div class="nav-links">
            <a href="/">ГЛАВНАЯ</a>
            <a href="/profile">ПРОФИЛЬ</a>
            <a href="/roles">РОЛИ</a>
            <a href="/docs">API DOCS</a>
        </div>
        
        <div class="status-bar">
            <div>
                <strong>СТАТУС:</strong> 
                <span id="tokenStatus" class="token-status inactive">НЕ АВТОРИЗОВАН</span>
            </div>
            <div>
                <button onclick="checkAuth()">ПРОВЕРИТЬ</button>
                <button onclick="logout()">ВЫЙТИ</button>
            </div>
        </div>
        
        <div id="message" class="message"></div>
        
        <div class="two-columns">
            <div class="form-section">
                <h2>СОЗДАТЬ РОЛЬ</h2>
                <form id="createRoleForm">
                    <div class="form-group">
                        <label>НАЗВАНИЕ</label>
                        <input type="text" id="roleName" placeholder="Администратор" required>
                    </div>
                    <div class="form-group">
                        <label>SLUG</label>
                        <input type="text" id="roleSlug" placeholder="admin" required>
                        <small>только латиница, цифры, дефис, подчеркивание</small>
                    </div>
                    <div class="form-group">
                        <label>ОПИСАНИЕ</label>
                        <textarea id="roleDescription" rows="3" placeholder="Описание роли..."></textarea>
                    </div>
                    <button type="submit">СОЗДАТЬ</button>
                </form>
            </div>
            
            <div class="form-section">
                <h2>СОЗДАТЬ РАЗРЕШЕНИЕ</h2>
                <form id="createPermissionForm">
                    <div class="form-group">
                        <label>НАЗВАНИЕ</label>
                        <input type="text" id="permName" placeholder="Создание роли" required>
                    </div>
                    <div class="form-group">
                        <label>SLUG</label>
                        <input type="text" id="permSlug" placeholder="create-role" required>
                        <small>формат: действие-сущность (create-role, read-user)</small>
                    </div>
                    <div class="form-group">
                        <label>ОПИСАНИЕ</label>
                        <textarea id="permDescription" rows="3" placeholder="Описание разрешения..."></textarea>
                    </div>
                    <button type="submit">СОЗДАТЬ</button>
                </form>
            </div>
        </div>
        
        <div class="list-section">
            <h2>СПИСОК РОЛЕЙ</h2>
            <div id="rolesList">
                <div class="loading">ЗАГРУЗКА...</div>
            </div>
        </div>
        
        <div class="list-section">
            <h2>СПИСОК РАЗРЕШЕНИЙ</h2>
            <div id="permissionsList">
                <div class="loading">ЗАГРУЗКА...</div>
            </div>
        </div>
    </div>
    
    <script>
        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = 'message ' + (type || 'success');
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);
        }
        
        function getToken() {
            return localStorage.getItem('access_token');
        }
        
        function getHeaders() {
            return {
                'Authorization': 'Bearer ' + getToken(),
                'Content-Type': 'application/json'
            };
        }
        
        function checkAuth() {
            const token = getToken();
            const statusSpan = document.getElementById('tokenStatus');
            
            if (token) {
                statusSpan.innerHTML = 'АВТОРИЗОВАН';
                statusSpan.className = 'token-status active';
                loadRoles();
                loadPermissions();
            } else {
                statusSpan.innerHTML = 'НЕ АВТОРИЗОВАН';
                statusSpan.className = 'token-status inactive';
                showMessage('Пожалуйста, войдите в систему', 'error');
            }
        }
        
        async function loadRoles() {
            const token = getToken();
            if (!token) return;
            
            try {
                const response = await fetch('/api/roles', {
                    headers: getHeaders()
                });
                
                if (response.status === 401) {
                    showMessage('Сессия истекла, войдите заново', 'error');
                    return;
                }
                
                if (response.ok) {
                    const data = await response.json();
                    displayRoles(data.items || []);
                } else {
                    throw new Error('Ошибка загрузки');
                }
            } catch (error) {
                document.getElementById('rolesList').innerHTML = '<div class="empty">ОШИБКА ЗАГРУЗКИ</div>';
            }
        }
        
        function displayRoles(roles) {
            const container = document.getElementById('rolesList');
            
            if (!roles || roles.length === 0) {
                container.innerHTML = '<div class="empty">РОЛИ НЕ НАЙДЕНЫ</div>';
                return;
            }
            
            let html = '<table><thead><tr><th>ID</th><th>НАЗВАНИЕ</th><th>SLUG</th><th>ОПИСАНИЕ</th><th>СТАТУС</th><th>ДЕЙСТВИЯ</th></tr></thead><tbody>';
            
            for (const role of roles) {
                const isDeleted = role.deleted_at !== null;
                html += `<tr>
                    <td>${role.id}</td>
                    <td><strong>${escapeHtml(role.name)}</strong></td>
                    <td><code>${escapeHtml(role.slug)}</code></td>
                    <td>${escapeHtml(role.description || '-')}</td>
                    <td><span class="badge ${isDeleted ? 'deleted' : 'active'}">${isDeleted ? 'УДАЛЕНА' : 'АКТИВНА'}</span></td>
                    <td class="actions">`;
                
                if (!isDeleted) {
                    html += `<button onclick="softDeleteRole(${role.id})">МЯГКО</button>
                             <button onclick="hardDeleteRole(${role.id})" class="danger">ЖЕСТКО</button>`;
                } else {
                    html += `<button onclick="restoreRole(${role.id})">ВОССТАНОВИТЬ</button>
                             <button onclick="hardDeleteRole(${role.id})" class="danger">УДАЛИТЬ</button>`;
                }
                
                html += `</td></tr>`;
            }
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        async function loadPermissions() {
            const token = getToken();
            if (!token) return;
            
            try {
                const response = await fetch('/api/permissions', {
                    headers: getHeaders()
                });
                
                if (response.ok) {
                    const data = await response.json();
                    displayPermissions(data.items || []);
                } else {
                    throw new Error('Ошибка загрузки');
                }
            } catch (error) {
                document.getElementById('permissionsList').innerHTML = '<div class="empty">ОШИБКА ЗАГРУЗКИ</div>';
            }
        }
        
        function displayPermissions(permissions) {
            const container = document.getElementById('permissionsList');
            
            if (!permissions || permissions.length === 0) {
                container.innerHTML = '<div class="empty">РАЗРЕШЕНИЯ НЕ НАЙДЕНЫ</div>';
                return;
            }
            
            let html = '<table><thead><tr><th>ID</th><th>НАЗВАНИЕ</th><th>SLUG</th><th>ОПИСАНИЕ</th><th>СТАТУС</th><th>ДЕЙСТВИЯ</th></tr></thead><tbody>';
            
            for (const perm of permissions) {
                const isDeleted = perm.deleted_at !== null;
                html += `<tr>
                    <td>${perm.id}</td>
                    <td><strong>${escapeHtml(perm.name)}</strong></td>
                    <td><code>${escapeHtml(perm.slug)}</code></td>
                    <td>${escapeHtml(perm.description || '-')}</td>
                    <td><span class="badge ${isDeleted ? 'deleted' : 'active'}">${isDeleted ? 'УДАЛЕНО' : 'АКТИВНО'}</span></td>
                    <td class="actions">`;
                
                if (!isDeleted) {
                    html += `<button onclick="softDeletePermission(${perm.id})">МЯГКО</button>
                             <button onclick="hardDeletePermission(${perm.id})" class="danger">ЖЕСТКО</button>`;
                } else {
                    html += `<button onclick="restorePermission(${perm.id})">ВОССТАНОВИТЬ</button>
                             <button onclick="hardDeletePermission(${perm.id})" class="danger">УДАЛИТЬ</button>`;
                }
                
                html += `</td></tr>`;
            }
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        async function createRole(event) {
            event.preventDefault();
            
            const token = getToken();
            if (!token) {
                showMessage('НЕОБХОДИМА АВТОРИЗАЦИЯ', 'error');
                return;
            }
            
            const name = document.getElementById('roleName').value;
            const slug = document.getElementById('roleSlug').value;
            const description = document.getElementById('roleDescription').value;
            
            try {
                const response = await fetch(`/api/roles?name=${encodeURIComponent(name)}&slug=${encodeURIComponent(slug)}&description=${encodeURIComponent(description)}`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                
                if (response.status === 201) {
                    showMessage(`РОЛЬ "${name}" СОЗДАНА`, 'success');
                    document.getElementById('createRoleForm').reset();
                    loadRoles();
                } else if (response.status === 403) {
                    const error = await response.json();
                    showMessage(`ДОСТУП ЗАПРЕЩЕН: ${error.detail || 'НЕДОСТАТОЧНО ПРАВ'}`, 'error');
                } else {
                    const error = await response.json();
                    showMessage(`ОШИБКА: ${error.detail || 'НЕИЗВЕСТНАЯ ОШИБКА'}`, 'error');
                }
            } catch (error) {
                showMessage(`ОШИБКА: ${error.message}`, 'error');
            }
        }
        
        async function createPermission(event) {
            event.preventDefault();
            
            const token = getToken();
            if (!token) {
                showMessage('НЕОБХОДИМА АВТОРИЗАЦИЯ', 'error');
                return;
            }
            
            const name = document.getElementById('permName').value;
            const slug = document.getElementById('permSlug').value;
            const description = document.getElementById('permDescription').value;
            
            try {
                const response = await fetch(`/api/permissions?name=${encodeURIComponent(name)}&slug=${encodeURIComponent(slug)}&description=${encodeURIComponent(description)}`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                
                if (response.status === 201) {
                    showMessage(`РАЗРЕШЕНИЕ "${name}" СОЗДАНО`, 'success');
                    document.getElementById('createPermissionForm').reset();
                    loadPermissions();
                } else if (response.status === 403) {
                    const error = await response.json();
                    showMessage(`ДОСТУП ЗАПРЕЩЕН: ${error.detail || 'НЕДОСТАТОЧНО ПРАВ'}`, 'error');
                } else {
                    const error = await response.json();
                    showMessage(`ОШИБКА: ${error.detail || 'НЕИЗВЕСТНАЯ ОШИБКА'}`, 'error');
                }
            } catch (error) {
                showMessage(`ОШИБКА: ${error.message}`, 'error');
            }
        }
        
        async function softDeleteRole(roleId) {
            if (!confirm(`УДАЛИТЬ РОЛЬ ID ${roleId}?`)) return;
            
            try {
                const response = await fetch(`/api/roles/${roleId}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                
                if (response.status === 204) {
                    showMessage(`РОЛЬ ID ${roleId} УДАЛЕНА`, 'success');
                    loadRoles();
                } else {
                    showMessage('ОШИБКА УДАЛЕНИЯ', 'error');
                }
            } catch (error) {
                showMessage(`ОШИБКА: ${error.message}`, 'error');
            }
        }
        
        async function hardDeleteRole(roleId) {
            if (!confirm(`ПОЛНОСТЬЮ УДАЛИТЬ РОЛЬ ID ${roleId}? ЭТО ДЕЙСТВИЕ НЕОБРАТИМО!`)) return;
            
            try {
                const response = await fetch(`/api/roles/${roleId}/permanent`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                
                if (response.status === 204) {
                    showMessage(`РОЛЬ ID ${roleId} УДАЛЕНА НАВСЕГДА`, 'success');
                    loadRoles();
                } else {
                    showMessage('ОШИБКА УДАЛЕНИЯ', 'error');
                }
            } catch (error) {
                showMessage(`ОШИБКА: ${error.message}`, 'error');
            }
        }
        
        async function restoreRole(roleId) {
            try {
                const response = await fetch(`/api/roles/${roleId}/restore`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                
                if (response.status === 200) {
                    showMessage(`РОЛЬ ID ${roleId} ВОССТАНОВЛЕНА`, 'success');
                    loadRoles();
                } else {
                    showMessage('ОШИБКА ВОССТАНОВЛЕНИЯ', 'error');
                }
            } catch (error) {
                showMessage(`ОШИБКА: ${error.message}`, 'error');
            }
        }
        
        async function softDeletePermission(permId) {
            if (!confirm(`УДАЛИТЬ РАЗРЕШЕНИЕ ID ${permId}?`)) return;
            
            try {
                const response = await fetch(`/api/permissions/${permId}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                
                if (response.status === 204) {
                    showMessage(`РАЗРЕШЕНИЕ ID ${permId} УДАЛЕНО`, 'success');
                    loadPermissions();
                } else {
                    showMessage('ОШИБКА УДАЛЕНИЯ', 'error');
                }
            } catch (error) {
                showMessage(`ОШИБКА: ${error.message}`, 'error');
            }
        }
        
        async function hardDeletePermission(permId) {
            if (!confirm(`ПОЛНОСТЬЮ УДАЛИТЬ РАЗРЕШЕНИЕ ID ${permId}? ЭТО ДЕЙСТВИЕ НЕОБРАТИМО!`)) return;
            
            try {
                const response = await fetch(`/api/permissions/${permId}/permanent`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                
                if (response.status === 204) {
                    showMessage(`РАЗРЕШЕНИЕ ID ${permId} УДАЛЕНО НАВСЕГДА`, 'success');
                    loadPermissions();
                } else {
                    showMessage('ОШИБКА УДАЛЕНИЯ', 'error');
                }
            } catch (error) {
                showMessage(`ОШИБКА: ${error.message}`, 'error');
            }
        }
        
        async function restorePermission(permId) {
            try {
                const response = await fetch(`/api/permissions/${permId}/restore`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                
                if (response.status === 200) {
                    showMessage(`РАЗРЕШЕНИЕ ID ${permId} ВОССТАНОВЛЕНО`, 'success');
                    loadPermissions();
                } else {
                    showMessage('ОШИБКА ВОССТАНОВЛЕНИЯ', 'error');
                }
            } catch (error) {
                showMessage(`ОШИБКА: ${error.message}`, 'error');
            }
        }
        
        function logout() {
            const token = getToken();
            if (token) {
                fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                }).finally(() => {
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('refresh_token');
                    window.location.href = '/login';
                });
            } else {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/login';
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.getElementById('createRoleForm').addEventListener('submit', createRole);
        document.getElementById('createPermissionForm').addEventListener('submit', createPermission);
        
        checkAuth();
    </script>
</body>
</html>
