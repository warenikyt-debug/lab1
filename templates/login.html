<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            text-align: center;
            padding: 10px;
            background-color: #f8d7da;
            border-radius: 5px;
        }
        .success {
            color: #28a745;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            text-align: center;
            padding: 10px;
            background-color: #d4edda;
            border-radius: 5px;
        }
        .token-info {
            background-color: #e7f3ff;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 14px;
            display: none;
            word-break: break-all;
        }
        .token-info pre {
            background: white;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .nav-links {
            margin-top: 20px;
            text-align: center;
        }
        .nav-links a {
            color: #007bff;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Вход в систему</h1>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" placeholder="TestUser1" value="TestUser1" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Test123!@#" value="Test123!@#" required>
            </div>

            <button type="submit">Войти</button>
            
            <div id="error" class="error"></div>
            <div id="success" class="success"></div>
        </form>

        <div id="tokenInfo" class="token-info">
            <strong>Токены получены:</strong>
            <pre id="tokens"></pre>
            <button onclick="copyTokens()" style="background: #007bff; margin-top: 10px;">Копировать токены</button>
        </div>

        <div class="nav-links">
            <a href="/register">Регистрация</a> |
            <a href="/profile" id="profileLink" style="display:none;">Профиль</a>
        </div>
    </div>

    <script>
        let currentTokens = null;

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            document.getElementById('tokenInfo').style.display = 'none';
            
            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    currentTokens = result;
                    document.getElementById('tokens').textContent = JSON.stringify(result, null, 2);
                    document.getElementById('tokenInfo').style.display = 'block';
                    document.getElementById('success').textContent = 'Вход выполнен успешно!';
                    document.getElementById('success').style.display = 'block';
                    document.getElementById('profileLink').style.display = 'inline';
                    
                    // Сохраняем токен в localStorage
                    localStorage.setItem('access_token', result.access_token);
                    localStorage.setItem('refresh_token', result.refresh_token);
                } else {
                    if (result.detail) {
                        if (Array.isArray(result.detail)) {
                            showError('Ошибка: ' + result.detail.map(err => err.msg).join(', '));
                        } else {
                            showError('Ошибка: ' + result.detail);
                        }
                    } else {
                        showError('Ошибка при входе');
                    }
                }
            } catch (error) {
                showError('Ошибка соединения с сервером');
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function copyTokens() {
            if (currentTokens) {
                const text = `Access Token: ${currentTokens.access_token}\nRefresh Token: ${currentTokens.refresh_token}`;
                navigator.clipboard.writeText(text);
                alert('Токены скопированы!');
            }
        }
    </script>
</body>
</html>
