<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC Testing Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            display: flex;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: #ffffff;
            border: 2px solid #000000;
            padding: 20px;
            margin-bottom: 20px;
        }

        h1 {
            color: #000000;
            border-bottom: 2px solid #000000;
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .login-section {
            background: #f5f5f5;
            padding: 15px;
            border: 1px solid #000000;
            margin-bottom: 15px;
        }

        .login-section h2 {
            color: #000000;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .login-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"],
        input[type="password"] {
            padding: 8px;
            border: 1px solid #000000;
            background-color: #ffffff;
            color: #000000;
            font-size: 13px;
            flex: 1;
            min-width: 120px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border: 2px solid #000000;
        }

        button {
            padding: 8px 15px;
            border: 2px solid #000000;
            background-color: #000000;
            color: #ffffff;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        button:hover {
            background-color: #333333;
            border-color: #333333;
        }

        .user-info {
            background: #f5f5f5;
            padding: 15px;
            border: 1px solid #000000;
            margin-bottom: 15px;
        }

        .user-info h3 {
            color: #000000;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .user-card {
            background: #ffffff;
            border: 1px solid #000000;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.6;
        }

        .main-content {
            display: flex;
            gap: 20px;
        }

        .sidebar {
            width: 200px;
            background: #ffffff;
            border: 2px solid #000000;
            padding: 15px;
        }

        .sidebar h3 {
            color: #000000;
            font-size: 12px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #000000;
        }

        .menu-item {
            padding: 8px 10px;
            margin-bottom: 5px;
            background: #f5f5f5;
            border: 1px solid #000000;
            cursor: pointer;
            font-size: 12px;
            color: #000000;
        }

        .menu-item:hover {
            background: #e0e0e0;
        }

        .menu-item.active {
            background: #000000;
            color: #ffffff;
        }

        .content {
            flex: 1;
            background: #ffffff;
            border: 2px solid #000000;
            padding: 20px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section h2 {
            color: #000000;
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #000000;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 8px 12px;
            border: 2px solid #000000;
            background-color: #ffffff;
            color: #000000;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            min-width: 120px;
            text-align: center;
        }

        .action-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .result {
            background: #f5f5f5;
            border: 1px solid #000000;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .result-label {
            color: #000000;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-content {
            background: #ffffff;
            border: 1px solid #000000;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-content pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border: 1px solid #000000;
            font-size: 11px;
            font-weight: bold;
            margin-right: 10px;
            background: #ffffff;
            color: #000000;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #000000;
            font-weight: bold;
            font-size: 12px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #000000;
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            font-size: 12px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border: 2px solid #000000;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-container {
            background: #f5f5f5;
            padding: 15px;
            border: 1px solid #000000;
            margin-bottom: 20px;
        }

        .form-container h3 {
            color: #000000;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .form-container button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        .not-authorized {
            text-align: center;
            padding: 40px 20px;
            color: #000000;
        }

        .not-authorized h2 {
            color: #000000;
            margin-bottom: 10px;
        }

        .error-box {
            background: #eeeeee;
            border: 2px solid #000000;
            padding: 15px;
            margin-bottom: 15px;
            color: #000000;
            font-size: 12px;
        }

        .success-box {
            background: #dddddd;
            border: 2px solid #000000;
            padding: 15px;
            margin-bottom: 15px;
            color: #000000;
            font-size: 12px;
        }

        .info-box {
            background: #f5f5f5;
            border: 1px solid #000000;
            padding: 15px;
            margin-bottom: 15px;
            color: #000000;
            font-size: 12px;
            line-height: 1.6;
        }

        .info-box h3 {
            color: #000000;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .info-box ul {
            margin-left: 20px;
        }

        .info-box li {
            margin-bottom: 5px;
        }

        .test-accounts {
            position: fixed;
            top: 100px;
            right: 20px;
            background: #ffffff;
            border: 2px solid #000000;
            padding: 15px;
            z-index: 1000;
            max-width: 300px;
        }

        .test-accounts h3 {
            color: #000000;
            font-size: 12px;
            margin-bottom: 10px;
            border-bottom: 1px solid #000000;
            padding-bottom: 5px;
        }

        .test-account-item {
            background: #f5f5f5;
            border: 1px solid #000000;
            padding: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 11px;
            color: #000000;
        }

        .test-account-item:hover {
            background: #e0e0e0;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                margin-bottom: 10px;
            }

            .test-accounts {
                position: static;
                margin-bottom: 15px;
                max-width: none;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }

            .login-form {
                flex-direction: column;
            }

            input[type="text"],
            input[type="password"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <h1>RBAC Testing Console</h1>
            
            <div class="login-section">
                <h2>LOGIN</h2>
                <div class="login-form">
                    <input type="text" id="username" placeholder="Username" value="Admin123">
                    <input type="password" id="password" placeholder="Password" value="Admin@123">
                    <button onclick="login()">Login</button>
                    <button onclick="loadTestUsers()">Test Accounts</button>
                </div>
            </div>

            <div id="userSection" class="not-authorized">
                <h2>Not Authorized</h2>
                <p>Please login to continue</p>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <div id="mainContent" style="display: none;">
            <div id="testAccounts" class="test-accounts" style="display: none;">
                <h3>TEST ACCOUNTS</h3>
                <div class="test-account-item" onclick="setCredentials('Admin123', 'Admin@123')">
                    ADMIN (Full Access)<br>
                    Admin123 / Admin@123
                </div>
                <div class="test-account-item" onclick="setCredentials('LimitedUser', 'LimitedPass123!@#')">
                    USER (Limited Access)<br>
                    LimitedUser / LimitedPass123!@#
                </div>
            </div>

            <div class="main-content">
                <!-- SIDEBAR -->
                <div class="sidebar">
                    <h3>SECTIONS</h3>
                    <div class="menu-item active" onclick="switchSection('roles')">ROLES</div>
                    <div class="menu-item" onclick="switchSection('permissions')">PERMISSIONS</div>
                    <div class="menu-item" onclick="switchSection('users')">USERS</div>
                    <div class="menu-item" onclick="switchSection('user-roles')">USER ROLES</div>
                    <div class="menu-item" onclick="switchSection('info')">INFO</div>
                </div>

                <!-- CONTENT -->
                <div class="content">
                    <!-- ROLES SECTION -->
                    <div id="roles" class="section active">
                        <h2>ROLES</h2>
                        <div class="action-buttons">
                            <button class="action-btn" onclick="testGetRoles()">Get All Roles</button>
                            <button class="action-btn" onclick="showCreateRoleForm()">Create Role</button>
                            <button class="action-btn" onclick="showUpdateRoleForm()">Update Role</button>
                            <button class="action-btn" onclick="showDeleteRoleForm()">Delete Role</button>
                            <button class="action-btn" onclick="showSoftDeleteRoleForm()">Soft Delete</button>
                            <button class="action-btn" onclick="showRestoreRoleForm()">Restore</button>
                        </div>
                        <div id="rolesResult"></div>
                    </div>

                    <!-- PERMISSIONS SECTION -->
                    <div id="permissions" class="section">
                        <h2>PERMISSIONS</h2>
                        <div class="action-buttons">
                            <button class="action-btn" onclick="testGetPermissions()">Get All Permissions</button>
                            <button class="action-btn" onclick="showCreatePermissionForm()">Create Permission</button>
                            <button class="action-btn" onclick="showUpdatePermissionForm()">Update Permission</button>
                            <button class="action-btn" onclick="showDeletePermissionForm()">Delete Permission</button>
                            <button class="action-btn" onclick="showSoftDeletePermissionForm()">Soft Delete</button>
                            <button class="action-btn" onclick="showRestorePermissionForm()">Restore</button>
                        </div>
                        <div id="permissionsResult"></div>
                    </div>

                    <!-- USERS SECTION -->
                    <div id="users" class="section">
                        <h2>USERS</h2>
                        <div class="action-buttons">
                            <button class="action-btn" onclick="testGetUsers()">Get All Users</button>
                        </div>
                        <div id="usersResult"></div>
                    </div>

                    <!-- USER ROLES SECTION -->
                    <div id="user-roles" class="section">
                        <h2>USER ROLES</h2>
                        <div class="action-buttons">
                            <button class="action-btn" onclick="showGetUserRolesForm()">Get User Roles</button>
                            <button class="action-btn" onclick="showAssignRoleForm()">Assign Role</button>
                            <button class="action-btn" onclick="showRemoveRoleForm()">Remove Role</button>
                            <button class="action-btn" onclick="showSoftRemoveRoleForm()">Soft Delete Role</button>
                            <button class="action-btn" onclick="showRestoreUserRoleForm()">Restore Role</button>
                        </div>
                        <div id="userRolesResult"></div>
                    </div>

                    <!-- INFO SECTION -->
                    <div id="info" class="section">
                        <h2>INFORMATION</h2>
                        <div id="infoContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';
        let currentUser = null;
        let currentToken = null;

        // ===== AUTHENTICATION =====
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    currentToken = data.access_token;
                    loadUserInfo();
                } else {
                    showError('Login error: ' + (data.detail || 'Invalid credentials'));
                }
            } catch (error) {
                showError('Connection error: ' + error.message);
            }
        }

        async function loadUserInfo() {
            try {
                const response = await fetch(`${API_URL}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                if (response.ok) {
                    const user = await response.json();
                    currentUser = user;

                    const rolesResponse = await fetch(`${API_URL}/ref/user/${user.id}/role`, {
                        headers: { 'Authorization': `Bearer ${currentToken}` }
                    });

                    let roles = [];
                    if (rolesResponse.ok) {
                        roles = await rolesResponse.json();
                    }

                    updateUserUI(user, roles);
                    document.getElementById('mainContent').style.display = 'block';
                    showInfo();
                } else {
                    showError('Error loading profile');
                }
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        function updateUserUI(user, roles) {
            let rolesText = roles && roles.length > 0 
                ? roles.map(r => r.name || r).join(', ')
                : 'No roles';

            document.getElementById('userSection').innerHTML = `
                <div class="user-info">
                    <h3>LOGGED IN AS</h3>
                    <div class="user-card">
                        <strong>Username:</strong> ${user.username}<br>
                        <strong>Email:</strong> ${user.email}<br>
                        <strong>Roles:</strong> ${rolesText}
                    </div>
                    <button onclick="logout()" style="margin-top: 10px;">Logout</button>
                </div>
            `;
        }

        function logout() {
            currentUser = null;
            currentToken = null;
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('userSection').innerHTML = '<h2>Not Authorized</h2><p>Please login to continue</p>';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function loadTestUsers() {
            document.getElementById('testAccounts').style.display = 
                document.getElementById('testAccounts').style.display === 'none' ? 'block' : 'none';
        }

        function setCredentials(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        // ===== UI CONTROLS =====
        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        function showResult(containerId, title, status, data) {
            let html = `
                <div class="result">
                    <div class="result-label">
                        <span class="status-badge">${status}</span>
                        ${title}
                    </div>
                    <div class="result-content">
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                </div>
            `;

            if (status === 403) {
                html = `<div class="error-box">ERROR: ACCESS DENIED (403)</div>` + html;
            }

            document.getElementById(containerId).innerHTML = html;
        }

        function showError(message) {
            const container = document.createElement('div');
            container.className = 'error-box';
            container.textContent = 'ERROR: ' + message;
            document.querySelector('.content').prepend(container);

            setTimeout(() => container.remove(), 5000);
        }

        function showInfo() {
            document.getElementById('infoContent').innerHTML = `
                <div class="success-box">
                    Logged in successfully!
                </div>
                <div class="info-box">
                    <h3>How to use this console:</h3>
                    <ul>
                        <li>Select section from menu on the left</li>
                        <li>Click buttons to make API requests</li>
                        <li>Results will appear below the buttons</li>
                        <li>If you see "ERROR: ACCESS DENIED (403)" message, your role does not have required permission</li>
                        <li>Try logging in as Admin for full access</li>
                        <li>Try logging in as regular User to test permission restrictions</li>
                    </ul>
                </div>
            `;
        }

        // ===== ROLES API CALLS =====
        async function testGetRoles() {
            try {
                const response = await fetch(`${API_URL}/ref/policy/role`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await response.json();
                showResult('rolesResult', 'GET ALL ROLES', response.status, data);
            } catch (error) {
                showError(error.message);
            }
        }

        function showCreateRoleForm() {
            const form = `
                <div class="form-container">
                    <h3>CREATE ROLE</h3>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="roleName" placeholder="Role name">
                    </div>
                    <div class="form-group">
                        <label>Slug</label>
                        <input type="text" id="roleSlug" placeholder="slug-format">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="roleDescription" placeholder="Description"></textarea>
                    </div>
                    <button onclick="createRole()">CREATE</button>
                </div>
            `;
            document.getElementById('rolesResult').innerHTML = form;
        }

        async function createRole() {
            const name = document.getElementById('roleName').value;
            const slug = document.getElementById('roleSlug').value;
            const description = document.getElementById('roleDescription').value;

            if (!name || !slug) {
                showError('Please fill all required fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/ref/policy/role`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, slug, description })
                });
                const data = await response.json();
                showResult('rolesResult', `CREATE ROLE (${response.status})`, response.status, data);
            } catch (error) {
                showError(error.message);
            }
        }

        function showUpdateRoleForm() {
            const form = `
                <div class="form-container">
                    <h3>UPDATE ROLE</h3>
                    <div class="form-group">
                        <label>Role ID</label>
                        <input type="number" id="roleIdUpdate" placeholder="Role ID">
                    </div>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="roleNameUpdate" placeholder="New name">
                    </div>
                    <div class="form-group">
                        <label>Slug</label>
                        <input type="text" id="roleSlugUpdate" placeholder="New slug">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="roleDescriptionUpdate" placeholder="New description"></textarea>
                    </div>
                    <button onclick="updateRole()">UPDATE</button>
                </div>
            `;
            document.getElementById('rolesResult').innerHTML = form;
        }

        async function updateRole() {
            const id = document.getElementById('roleIdUpdate').value;
            const name = document.getElementById('roleNameUpdate').value;
            const slug = document.getElementById('roleSlugUpdate').value;
            const description = document.getElementById('roleDescriptionUpdate').value;

            if (!id || !name || !slug) {
                showError('Please fill all required fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/ref/policy/role/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, slug, description })
                });
                const data = await response.json();
                showResult('rolesResult', `UPDATE ROLE (${response.status})`, response.status, data);
            } catch (error) {
                showError(error.message);
            }
        }

        function showDeleteRoleForm() {
            const form = `
                <div class="form-container">
                    <h3>DELETE ROLE</h3>
                    <div class="form-group">
                        <label>Role ID</label>
                        <input type="number" id="roleIdDelete" placeholder="Role ID">
                    </div>
                    <button onclick="deleteRole()">DELETE</button>
                </div>
            `;
            document.getElementById('rolesResult').innerHTML = form;
        }

        async function deleteRole() {
            const id = document.getElementById('roleIdDelete').value;
            if (!id) {
                showError('Please enter Role ID');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/ref/policy/role/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = response.status === 204 ? { message: 'Deleted successfully' } : await response.json();
                showResult('rolesResult', `DELETE ROLE (${response.status})`, response.status, data);
            } catch (error) {
                showError(error.message);
            }
        }

        function showSoftDeleteRoleForm() {
            const form = `
                <div class="form-container">
                    <h3>SOFT DELETE ROLE</h3>
                    <div class="form-group">
                        <label>Role ID</label>
                        <input type="number" id="roleIdSoftDelete" placeholder="Role ID">
                    </div>
                    <button onclick="softDeleteRole()">SOFT DELETE</button>
                </div>
            `;
            document.getElementById('rolesResult').innerHTML = form;
        }

        async function softDeleteRole() {
            const id = document.getElementById('roleIdSoftDelete').value;
            if (!id) {
                showError('Please enter Role ID');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/ref/policy/role/${id}/soft`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = response.status === 204 ? { message: 'Soft deleted successfully' } : await response.json();
                showResult('rolesResult', `SOFT DELETE ROLE (${response.status})`, response.status, data);
            } catch (error) {
                showError(error.message);
            }
        }

        function showRestoreRoleForm() {
            const form = `
                <div class="form-container">
                    <h3>RESTORE ROLE</h3>
                    <div class="form-group">
                        <label>Role ID</label>
                        <input type="number" id="roleIdRestore" placeholder="Role ID">
                    </div>
                    <button onclick="restoreRole()">RESTORE</button>
                </div>
            `;
            document.getElementById('rolesResult').innerHTML = form;
        }

        async function restoreRole() {
            const id = document.getElementById('roleIdRestore').value;
            if (!id) {
                showError('Please enter Role ID');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/ref/policy/role/${id}/restore`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await response.json();
                showResult('rolesResult', `RESTORE ROLE (${response.status})`, response.status, data);
            } catch (error) {
                showError(error.message);
            }
        }

        // ===== PERMISSIONS API CALLS =====
        async function testGetPermissions() {
            try {
                const response = await fetch(`${API_URL}/ref/policy/permission`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await response.json();
