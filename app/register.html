<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .success {
            color: #28a745;
            font-size: 14px;
            margin-top: 5px;
            display: none;
            text-align: center;
            padding: 10px;
            background-color: #d4edda;
            border-radius: 4px;
        }
        .info {
            background-color: #e7f3ff;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #004085;
            border: 1px solid #b8daff;
        }
        .info ul {
            margin: 5px 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <h1>Регистрация</h1>
    
    <div class="info">
        <strong>Требования к паролю:</strong>
        <ul>
            <li>Минимум 8 символов</li>
            <li>Хотя бы одна ЗАГЛАВНАЯ буква</li>
            <li>Хотя бы одна цифра</li>
            <li>Хотя бы один спецсимвол (!@#$%^&*)</li>
        </ul>
        <strong>Требования к имени:</strong>
        <ul>
            <li>Минимум 7 символов</li>
            <li>Начинается с заглавной буквы</li>
            <li>Только латиница и цифры</li>
        </ul>
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label for="username">Имя пользователя:</label>
            <input type="text" id="username" name="username" placeholder="TestUser1" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="user@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" placeholder="Test123!@#" required>
        </div>

        <div class="form-group">
            <label for="c_password">Подтверждение пароля:</label>
            <input type="password" id="c_password" name="c_password" placeholder="Test123!@#" required>
        </div>

        <div class="form-group">
            <label for="birthday">Дата рождения:</label>
            <input type="date" id="birthday" name="birthday" value="2000-01-01" required>
        </div>

        <button type="submit">Зарегистрироваться</button>
        
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>
    </form>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Прячем старые сообщения
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            
            // Собираем данные
            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                c_password: document.getElementById('c_password').value,
                birthday: document.getElementById('birthday').value
            };
            
            // Простая проверка на клиенте
            if (data.password !== data.c_password) {
                showError('Пароли не совпадают');
                return;
            }
            
            try {
                // Отправляем запрос
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // Успех - код 201
                    showSuccess('Регистрация прошла успешно! ID: ' + result.id);
                    console.log('Ответ:', result);
                    
                    // Очищаем форму
                    document.getElementById('registerForm').reset();
                } else {
                    // Ошибка
                    if (result.detail) {
                        if (Array.isArray(result.detail)) {
                            // Ошибка валидации Pydantic
                            const errors = result.detail.map(err => err.msg || err.message).join(', ');
                            showError('Ошибка валидации: ' + errors);
                        } else {
                            // Обычная ошибка
                            showError('Ошибка: ' + result.detail);
                        }
                    } else {
                        showError('Произошла ошибка при регистрации');
                    }
                    console.error('Ошибка:', result);
                }
            } catch (error) {
                showError('Ошибка соединения с сервером');
                console.error('Fetch error:', error);
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
    </script>
</body>
</html>
